# Resume Forge — production stack. Full instructions: docs/DEPLOY.md
#
#   internet ──► edge (Caddy, TLS, :80/:443)
#                  ├── /api/pdf ──► pdf  (Node + headless Chromium, :3040)
#                  └── /*       ──► web  (static app, :8080)
#                                    ▲
#                  pdf ── /print ────┘  (renders the same page the user previews)
#
# Only `edge` is reachable from outside. `web` and `pdf` sit on an internal
# network with no route to the internet, so a resume rendered by Chromium can
# reach nothing but the web app it is printing.

name: resume-forge

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits re-issuance — never `down -v` casually.
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [public, backend]
    depends_on:
      web:
        condition: service_healthy
      pdf:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: resume-forge-web:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *logging

  pdf:
    build:
      context: ./pdf-service
    image: resume-forge-pdf:latest
    restart: unless-stopped
    # Chromium spawns many processes; a real init reaps them.
    init: true
    environment:
      # Where Chromium loads the app from. Fixed here, never taken from a
      # request: that is what stops the service being used to fetch arbitrary
      # URLs from inside your network.
      RENDER_ORIGIN: http://web:8080
      # The edge proxy is one hop in front; trust exactly it for client IPs,
      # which the rate limiter keys on.
      TRUST_PROXY_HOPS: "1"
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      PDF_RATE_LIMIT_PER_MINUTE: ${PDF_RATE_LIMIT_PER_MINUTE:-30}
      PDF_QUEUE_TIMEOUT_MS: ${PDF_QUEUE_TIMEOUT_MS:-20000}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-30000}
    read_only: true
    tmpfs:
      # Chromium's profile and, with --disable-dev-shm-usage, its shared memory.
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PDF_MEMORY_LIMIT:-1536m}
    pids_limit: 512
    # Lets in-flight exports finish on `docker compose up` / restart.
    stop_grace_period: 45s
    networks: [backend]
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

networks:
  public: {}
  backend:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
