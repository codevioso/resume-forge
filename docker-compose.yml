# Paperplane — production stack. Full instructions: docs/DEPLOY.md
#
#   internet ──► edge (Caddy, TLS, :80/:443)
#                  ├── /api/pdf ──► pdf  (Node + headless Chromium, :3040)
#                  ├── /api/*   ──► api  (Node: accounts + saved resumes, :3050) ──► db (MySQL)
#                  └── /*       ──► web  (static app, :8080)
#                                    ▲
#                  pdf ── /print ────┘  (renders the same page the user previews)
#
#   backup ──► db   (nightly dump into ./backups)
#
# Only `edge` is reachable from outside. `web`, `pdf` and `db` have no route to
# the internet at all; `api` reaches out only to send email and to talk to
# Google during sign-in.

name: paperplane

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  edge:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits re-issuance — never `down -v` casually.
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: [public, backend]
    depends_on:
      web:
        condition: service_healthy
      pdf:
        condition: service_healthy
      api:
        condition: service_healthy
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: paperplane-web:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *logging

  pdf:
    build:
      context: ./pdf-service
    image: paperplane-pdf:latest
    restart: unless-stopped
    # Chromium spawns many processes; a real init reaps them.
    init: true
    environment:
      # Where Chromium loads the app from. Fixed here, never taken from a
      # request: that is what stops the service being used to fetch arbitrary
      # URLs from inside your network.
      RENDER_ORIGIN: http://web:8080
      # The edge proxy is one hop in front; trust exactly it for client IPs,
      # which the rate limiter keys on.
      TRUST_PROXY_HOPS: "1"
      PDF_CONCURRENCY: ${PDF_CONCURRENCY:-2}
      PDF_RATE_LIMIT_PER_MINUTE: ${PDF_RATE_LIMIT_PER_MINUTE:-30}
      PDF_QUEUE_TIMEOUT_MS: ${PDF_QUEUE_TIMEOUT_MS:-20000}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-30000}
    read_only: true
    tmpfs:
      # Chromium's profile and, with --disable-dev-shm-usage, its shared memory.
      - /tmp:size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${PDF_MEMORY_LIMIT:-1536m}
    pids_limit: 512
    # Lets in-flight exports finish on `docker compose up` / restart.
    stop_grace_period: 45s
    networks: [backend]
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  api:
    build:
      context: ./api
    image: paperplane-api:latest
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      DATABASE_URL: mysql://paperplane:${DB_PASSWORD:?set DB_PASSWORD in .env}@db:3306/paperplane
      # Email (verification, password reset, sign-in links). Both or neither;
      # without them, email-and-password and sign-in links are switched off.
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Google sign-in. Both or neither.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MAX_RESUMES_PER_USER: ${MAX_RESUMES_PER_USER:-50}
      TRUST_PROXY_HOPS: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    # backend: reached by the edge. data: reaches the database.
    # egress: the only service besides the edge with a route out — for SMTP
    # and Google's token endpoint.
    networks: [backend, data, egress]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: paperplane
      MYSQL_USER: paperplane
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Sized for a small VPS shared with Chromium; raise with more RAM.
      - --innodb-buffer-pool-size=256M
    volumes:
      # Every account and resume lives here. Back it up (the backup service
      # does nightly) and never `docker compose down -v` on a live server.
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    mem_limit: ${DB_MEMORY_LIMIT:-768m}
    # Gives MySQL time to flush and shut down cleanly.
    stop_grace_period: 60s
    networks: [data]
    logging: *logging

  backup:
    image: mysql:8.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      # On the host, next to docker-compose.yml. Copy it off the server too —
      # a backup on the same disk does not survive losing the disk.
      - ./backups:/backups
    networks: [data]
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

networks:
  public: {}
  backend:
    internal: true
  data:
    internal: true
  egress: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  mysql_data: {}
